name: Database wakker houden

# Supabase pauzeert gratis projecten na een week zonder databaseactiviteit.
# Elke drie dagen één query via /api/health voorkomt dat.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health-check
        run: |
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors \
            https://km-delen.vercel.app/api/health
